<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品 · 何年</title>
  <meta name="description" content="何年的一件 AI 作品。">
  <meta name="theme-color" content="#f4f0e6">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ai-portfolio-lang");
        if (saved === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dataset.lang = "en";
        } else {
          document.documentElement.dataset.lang = "zh";
        }
      } catch (e) {
        document.documentElement.dataset.lang = "zh";
      }
    })();
  </script>
  <script src="site.js" defer></script>
</head>
<body data-page="work" data-title-zh="作品 · 何年" data-title-en="Work · He Nian">
  <a class="skip" href="#main" data-i18n="skip">跳到内容</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <svg class="mark" viewBox="0 0 36 36" width="28" height="28" aria-hidden="true">
          <rect x="14" y="2" width="8" height="8"></rect>
          <rect x="2" y="22" width="8" height="8"></rect>
          <rect x="26" y="22" width="8" height="8"></rect>
        </svg>
        <span>何年</span>
      </a>
      <nav class="nav" data-i18n-aria="navLabel" aria-label="页面">
        <a href="works.html" data-i18n="navWorks">作品</a>
        <a href="about.html" data-i18n="navAbout">关于</a>
      </nav>
      <div class="lang" role="group" data-i18n-aria="langLabel" aria-label="语言">
        <button type="button" data-lang-set="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang-set="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div class="wrap">
      <noscript>
        <p class="note">请开启 JavaScript，页面需要读取 works.json。 / Enable JavaScript so this page can read works.json.</p>
      </noscript>
      <p class="back"><a href="works.html"><span aria-hidden="true">← </span><span data-i18n="backToWorks">全部作品</span></a></p>
      <p id="status" class="status" role="status">正在读取作品…</p>
      <article id="work" hidden></article>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-note" data-i18n="footerBlurb">以后的 AI 作品也放在这里。</p>
      <ul class="footer-links">
        <li><a href="https://github.com/luke-arch-git/ai-portfolio" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="works.html" data-i18n="navWorks">作品</a></li>
        <li><a href="about.html" data-i18n="navAbout">关于</a></li>
      </ul>
    </div>
  </footer>
  <dialog id="lightbox" aria-label="静帧">
    <div class="lb-bar">
      <p id="lb-count"></p>
      <button type="button" id="lb-prev" data-i18n="prev">上一张</button>
      <button type="button" id="lb-next" data-i18n="next">下一张</button>
      <button type="button" id="lb-close" data-i18n="close">关闭</button>
    </div>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <p id="lb-hint" class="lb-hint" data-i18n="lbHint">左右方向键可以切换</p>
  </dialog>
</body>
</html>
